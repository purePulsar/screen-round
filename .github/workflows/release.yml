name: Release

# 推一个 v* 的标签 → 打 .deb → 冒烟测试 → 建 Release 并把 .deb 挂上去。
# 也可以在 Actions 页面手动触发：只打包装 artifact，不发 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含前导 v），例如 0.1.1"
        required: true
        type: string

# 建 Release 要写权限；仓库默认的 GITHUB_TOKEN 可能是只读的，这里显式声明
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          # 版本号会直接进 .deb 文件名和 control 文件，先挡掉奇怪的字符
          case "$version" in
            "" | *[!0-9A-Za-z.+~-]*)
              echo "版本号不合法: '$version'" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "本次版本：$version"

      - name: 装构建与测试依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils dbus desktop-file-utils \
            python3-tk python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1

      - name: 打 .deb
        env:
          SCREEN_ROUND_VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/build-deb.sh

      - name: 冒烟测试（把包拆开真跑一遍）
        run: packaging/smoke-test.sh "dist/screen-round_${{ steps.ver.outputs.version }}_all.deb"

      - name: 算校验和
        run: cd dist && sha256sum ./*.deb > SHA256SUMS && cat SHA256SUMS

      - name: 建 Release 并挂上 .deb
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dist/screen-round_${{ steps.ver.outputs.version }}_all.deb" \
            dist/SHA256SUMS

      - name: 手动触发时把包留成 artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: screen-round-${{ steps.ver.outputs.version }}-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
